name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee build.log
      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "error:|\.java:[0-9]+|symbol:|location:" build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: witch-client
          path: build/libs/*.jar